name: Generated skills consistency
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consistency:
    # Required status check (ruleset "Generated skills consistency"); runs automatically.
    name: Generated skills consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm run check:pi

  test-ubuntu:
    name: Tests (Ubuntu)
    if: github.repository == 'keli-wen/agy-staff'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm test

  test-windows:
    # Gated by the "manual-tests" environment: a reviewer must approve before it runs.
    name: Tests (Windows)
    if: github.repository == 'keli-wen/agy-staff'
    runs-on: windows-latest
    environment: manual-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # Per-test timeout so a hung test surfaces as one failure instead of
      # stalling the whole job until timeout-minutes cancels it.
      - run: node --test --test-timeout=60000 tests/*.test.mjs
